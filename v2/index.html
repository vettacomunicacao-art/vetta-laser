:root{
  --bg:#ffffff; --ink:#241A1F; --muted:#6b625b; --accent:#C87B31; --accent-deep:#A9611F;
  --line:#e4d8cb; --soft:#fbf1e6; --field:#fffdfb; --err:#b3261e; --track:#f0e6dc;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Lato',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji';
  font-size:16px; line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font-family:inherit; cursor:pointer}
.wrap{max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding-block:14px 22px}
.top{display:flex; align-items:center; gap:12px; min-height:40px}
.back{width:40px; height:40px; border-radius:50%; border:0; background:transparent; font-size:22px; color:var(--ink); display:flex; align-items:center; justify-content:center; flex:none}
.back[hidden]{display:none}
.back:focus-visible,.btn:focus-visible,.opt:focus-visible,.slot:focus-visible,.day:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.prog{flex:1; height:6px; background:var(--track); border-radius:6px; overflow:hidden}
.prog i{display:block; height:100%; width:0; background:var(--accent); border-radius:6px; transition:width .35s ease}
.screen{flex:1; display:flex; flex-direction:column; animation:fade .28s ease}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.prog i{transition:none}}
.logo{display:flex; justify-content:center; padding:18px 0 0}
.logo img{height:40px; width:auto}
h1{font-weight:900; font-size:clamp(28px,8vw,34px); line-height:1.14; letter-spacing:-.01em; margin:44px 0 0; text-wrap:balance}
h1 em{font-style:normal; color:var(--accent)}
.bul{list-style:none; margin:22px 0 0; padding:0; display:flex; flex-direction:column; gap:13px}
.bul li{font-size:18.5px; font-weight:700}
.foot{font-style:italic; font-weight:700; color:var(--accent-deep); font-size:14.5px; margin:26px 0 0}
.btn{display:block; width:100%; border:0; border-radius:40px; background:var(--accent); color:#fff; font-weight:900; font-size:18px; letter-spacing:.01em; padding:19px 16px; text-align:center; text-decoration:none; box-shadow:0 10px 22px rgba(200,123,49,.32); transition:transform .12s ease, opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45; box-shadow:none; cursor:not-allowed}
.spacer{flex:1; min-height:28px}
.qn{font-size:15px; font-weight:900; color:var(--accent); margin:46px 0 10px}
.qt{font-size:clamp(23px,6.6vw,27px); font-weight:900; line-height:1.2; margin:0; text-wrap:balance}
.qs{font-size:15px; color:var(--muted); margin:10px 0 0; line-height:1.45}
.field{margin-top:26px; display:flex; align-items:center; border:2px solid var(--line); border-radius:14px; background:var(--field); padding:0 16px; transition:border-color .15s}
.field:focus-within{border-color:var(--accent)}
.field.bad{border-color:var(--err)}
.field span{color:#9d9186; font-size:19px; margin-right:2px}
.field input{flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:19px; color:var(--ink); padding:16px 0}
.field input::placeholder{color:#b5a99c}
.err{color:var(--err); font-size:14px; font-weight:700; margin:8px 2px 0; min-height:18px}
.row{display:flex; align-items:center; gap:12px; margin-top:14px}
.ok{border:0; background:var(--accent); color:#fff; font-weight:900; font-size:17px; padding:13px 26px; border-radius:12px}
.hint{font-size:13px; color:#9a8f85}
@media (hover:none){.hint{display:none}}
.opts{display:flex; flex-direction:column; gap:11px; margin-top:24px}
.opt{display:flex; align-items:center; gap:12px; text-align:left; width:100%; border:2px solid var(--line); background:var(--field); border-radius:14px; padding:14px; font-size:17px; font-weight:700; color:var(--ink); line-height:1.3; transition:background .15s,border-color .15s}
.opt b{width:28px; height:28px; border-radius:8px; border:2px solid var(--accent); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:14px; flex:none; transition:all .15s}
.opt.sel{border-color:var(--accent); background:var(--soft)}
.opt.sel b{background:var(--accent); color:#fff}
.cal{margin-top:18px; border:2px solid var(--line); border-radius:16px; padding:12px}
.calh{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.calh b{font-size:16px; font-weight:900; text-transform:capitalize}
.calh button{width:36px; height:36px; border-radius:10px; border:0; background:var(--soft); color:var(--accent-deep); font-size:18px; font-weight:900}
.calh button[disabled]{opacity:.3; cursor:default}
.g{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:14px}
.g .h{font-weight:700; color:#8a8077; font-size:12px; padding:4px 0}
.day{border:0; background:transparent; border-radius:10px; padding:9px 0; font-size:14px; color:#c9bfb5; font-weight:400}
.day.a{background:var(--soft); color:var(--ink); font-weight:700}
.day.s{background:var(--accent); color:#fff; font-weight:900}
.day[disabled]{cursor:default}
.sl{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; max-height:176px; overflow-y:auto; padding:2px}
.slot{border:2px solid var(--accent); background:#fff; color:var(--accent-deep); font-weight:900; border-radius:10px; padding:10px 0; font-size:15px}
.slot.s{background:var(--accent); color:#fff}
.lbl{font-size:14px; font-weight:700; color:var(--muted); margin-top:14px}
.calbox{width:100%;margin-top:16px;min-height:480px}
.demo{margin-top:14px; font-size:12.5px; color:var(--muted); background:#f6f2ee; border-radius:10px; padding:8px 10px; line-height:1.4}
.big{font-size:64px; line-height:1; margin-top:70px; text-align:center}
.center{text-align:center}
.center .qt{margin-top:18px}
.sum{margin:20px auto 0; background:var(--soft); border-radius:14px; padding:14px 16px; font-weight:700; text-align:center; max-width:340px}
iframe.cal-embed{width:100%; height:560px; border:0; margin-top:16px; border-radius:12px}
</style>

function send(){
  var q=new URLSearchParams(location.search), body=new URLSearchParams(), E=CONFIG.entry;
  body.append(E.nome,data.nome||""); body.append(E.insta,data.insta||""); body.append(E.tel,data.fone||"");

/* ---- Validação e máscara ---- */
function parseInsta(v){
  v = String(v).trim();
  var m = v.match(/instagram\.com\/([A-Za-z0-9._]+)/i); if(m) v = m[1];
  v = v.replace(/^@+/,"").replace(/\s+/g,"");
  return /^[A-Za-z0-9._]{1,30}$/.test(v) ? v : null;
}
function digits(v){ return String(v).replace(/\D/g,"").slice(0,11); }
function maskFone(v){
  var d = digits(v); if(!d) return "";
  if(d.length<=2) return "("+d;
  var ddd = d.slice(0,2), r = d.slice(2);
  if(d.length<=6) return "("+ddd+") "+r;
  if(d.length<=10) return "("+ddd+") "+r.slice(0,4)+"-"+r.slice(4);
  return "("+ddd+") "+r.slice(0,1)+" "+r.slice(1,5)+"-"+r.slice(5);
}
function foneOk(v){ return digits(v).length>=8; }

/* ---- Navegação ---- */

function go(to,push){
  if(push!==false) history_.push(step);
  step = to; render();
  window.scrollTo(0,0);
}
function back(){ if(!history_.length) return; step = history_.pop(); render(); }
$("back").addEventListener("click",back);
function progress(){
  var n = {nome:1,insta:2,fone:3,fat:4,inv:5,agenda:6,no:5}[step] || 0;
  $("prog").style.width = (n/TOTAL*100)+"%";
  $("progWrap").style.visibility = step==="cover" ? "hidden" : "visible";
  $("back").hidden = (step==="cover" || !history_.length);
}

function render(){
  var s = $("screen"); s._key=null; s.style.animation="none"; void s.offsetWidth; s.style.animation="";
  progress();
  var fn = {cover:vCover,nome:vNome,insta:vInsta,fone:vFone,fat:vFat,inv:vInv,agenda:vAgenda,no:vNo}[step];
  fn(s);
}

function textStep(s,n,title,sub,inner,validate,onOk){
  s.innerHTML = '<div class="qn">'+n+' →</div><h2 class="qt">'+title+'</h2>'+(sub?'<p class="qs">'+sub+'</p>':'')+
   '<div class="field" id="fld">'+inner+'</div><div class="err" id="err" role="alert"></div>'+
   '<div class="row"><button class="ok" id="ok">OK ✓</button><span class="hint">ou aperte Enter ↵</span></div>';
  var input = s.querySelector("input"), fld=$("fld"), err=$("err");
  function submit(){ var r = validate(input.value); if(r.error){ fld.classList.add("bad"); err.textContent=r.error; input.focus(); return; } onOk(r.value); }
  input.addEventListener("input",function(){ fld.classList.remove("bad"); err.textContent=""; });
  input.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); submit(); } });
  $("ok").addEventListener("click",submit);
  return input;
}
function vNome(s){
  var i = textStep(s,1,"Qual o seu nome?","",'<input id="in" type="text" autocomplete="name" placeholder="Digite sua resposta…" maxlength="120" aria-label="Seu nome">',
    function(v){ v=v.trim().replace(/\s+/g," "); return v.length<2 ? {error:"Digite seu nome para continuar."} : {value:v}; },
    function(v){ data.nome=v; go("insta"); });
  i.value=data.nome; i.focus();
}
function vInsta(s){
  var i = textStep(s,2,"Qual o @ da sua clínica no Instagram?","",'<input id="in" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="@suaclinica" aria-label="Instagram da clínica">',
    function(v){ return {value:v.trim()}; },
    function(v){ data.insta=v; go("fone"); });
  i.value=data.insta; i.focus();
}
function vFone(s){
  var i = textStep(s,3,"Qual é o seu telefone (WhatsApp)?","",'<input id="in" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(17) 9 9999-9999" maxlength="16" aria-label="Telefone com WhatsApp">',
    function(v){ return foneOk(v) ? {value:maskFone(v)} : {error:"Digite o seu telefone com DDD."}; },
    function(v){ data.fone=v; track("Contact"); go("fat"); });
  i.addEventListener("input",function(){ i.value = maskFone(i.value); });
  i.value=data.fone; i.focus();
}
function optStep(s,n,title,sub,list,key,after){
  s.innerHTML = '<div class="qn">'+n+' →</div><h2 class="qt">'+title+'</h2>'+(sub?'<p class="qs">'+sub+'</p>':'')+
   '<div class="opts" role="radiogroup">'+list.map(function(o){ return '<button class="opt'+(data[key]===o[2]?' sel':'')+'" role="radio" aria-checked="'+(data[key]===o[2])+'" data-k="'+o[0]+'"><b>'+o[0]+'</b><span>'+o[1]+'</span></button>'; }).join("")+'</div>';
  var done=false;
  function pick(k){ if(done) return; done=true; var o=list.filter(function(x){return x[0]===k;})[0]; data[key]=o[2]; [].forEach.call(s.querySelectorAll(".opt"),function(b){ b.classList.toggle("sel",b.dataset.k===k); }); setTimeout(after,260); }
  [].forEach.call(s.querySelectorAll(".opt"),function(b){ b.addEventListener("click",function(){ pick(b.dataset.k); }); });
  s._key = function(e){ var k=e.key.toUpperCase(); if(list.some(function(o){return o[0]===k;})) pick(k); };
}
function vFat(s){ optStep(s,4,"Qual o faturamento da sua empresa?","",FAT,"fat",function(){ go("inv"); }); }
function vInv(s){
  optStep(s,5,"Recomendamos investir pelo menos R$50 por dia em anúncios","Em média R$1.500 por mês em anúncios. Esse valor se alinha ao seu orçamento atual?<br>(Esse investimento não inclui o valor da nossa mão de obra.)",INV,"inv",function(){
    var qualificado = data.inv==="Sim" && data.fat!=="Até R$30 mil/mês";
    send();
    if(qualificado){ track("Lead",{content_name:"Clinica de laser",value:1,currency:"BRL"}); go("agenda"); }
    else { track("Contact",{content_name:"Nao qualificado"}); go("no"); }
  });
}
document.addEventListener("keydown",function(e){ var s=$("screen"); if(s._key && !e.metaKey && !e.ctrlKey && !e.altKey && document.activeElement.tagName!=="INPUT") s._key(e); });

function vNo(s){
  var url="https://wa.me/"+CONFIG.wa+"?text="+encodeURIComponent("Olá! Sou "+data.nome+(data.insta?" ("+data.insta+")":"")+". Vi o anúncio da Vetta e quero um plano personalizado para a minha clínica.");
